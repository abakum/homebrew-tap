name: Publish to Scoop

on:
  workflow_dispatch:
    inputs:
      force_submit:
        description: 'Force submit: close existing PR and create a new one'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  MANIFEST: crocson

jobs:
  publish-to-scoop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Extract version from manifest
        id: manifest
        run: |
          VERSION=$(jq -r '.version' bucket/${{ env.MANIFEST }}.json)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Error: Could not extract version from bucket/${{ env.MANIFEST }}.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Check if manifest already exists in ScoopInstaller/Extras
        id: check
        env:
          GH_TOKEN: ${{ secrets.SCOOP_TOKEN }}
        run: |
          if gh api "repos/ScoopInstaller/Extras/contents/bucket/${{ env.MANIFEST }}.json" \
               --jq '.sha' 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Manifest already exists in Extras — this will be an update"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Manifest does not exist in Extras — this is a new addition"
          fi

      - name: Fork ScoopInstaller/Extras
        env:
          GH_TOKEN: ${{ secrets.SCOOP_TOKEN }}
        run: |
          gh repo fork ScoopInstaller/Extras --clone=false 2>/dev/null || true

      - name: Clone fork and prepare manifest
        env:
          GH_TOKEN: ${{ secrets.SCOOP_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          GH_USER=$(gh api user --jq .login)
          FORK_REPO="${GH_USER}/Extras"
          echo "fork_repo=$FORK_REPO" >> "$GITHUB_ENV"

          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git" scoop-extras
          cd scoop-extras

          BRANCH_NAME="${{ env.MANIFEST }}-${VERSION}"
          git checkout -b "$BRANCH_NAME"

          cp "${{ github.workspace }}/bucket/${{ env.MANIFEST }}.json" "bucket/${{ env.MANIFEST }}.json"
          git add "bucket/${{ env.MANIFEST }}.json"

          if git diff --cached --quiet; then
            echo "No changes to commit (manifest is already up to date)"
            echo "skip_pr=true" >> "$GITHUB_ENV"
            exit 0
          fi

          IS_NEW="${{ steps.check.outputs.exists }}"
          if [[ "$IS_NEW" == "false" ]]; then
            COMMIT_MSG="${{ env.MANIFEST }}: Add version ${VERSION}"
          else
            COMMIT_MSG="${{ env.MANIFEST }}: Update to version ${VERSION}"
          fi

          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH_NAME" 2>&1 || git push --force origin "$BRANCH_NAME"

          echo "skip_pr=false" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: env.skip_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.SCOOP_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          IS_NEW="${{ steps.check.outputs.exists }}"
          BRANCH_NAME="${{ env.MANIFEST }}-${VERSION}"

          if [[ "$IS_NEW" == "false" ]]; then
            PR_TITLE="${{ env.MANIFEST }}: Add version ${VERSION}"
            PR_BODY=$(cat <<'EOF'
          ## New Manifest

          **Name:** ${{ env.MANIFEST }}
          **Version:** ${VERSION}
          **Description:** GUI for croc — secure file transfer tool
          **Homepage:** https://github.com/abakum/crocson
          **License:** ISC

          Manifest source: https://github.com/abakum/crocson
          EOF
          )
          else
            PR_TITLE="${{ env.MANIFEST }}: Update to version ${VERSION}"
            PR_BODY="Automated update for ${{ env.MANIFEST }} to version ${VERSION}.

          Manifest source: https://github.com/abakum/crocson"
          fi

          # Close existing open PRs if force_submit
          if [[ "${{ github.event.inputs.force_submit }}" == "true" ]]; then
            gh pr list --repo ScoopInstaller/Extras \
              --head "${{ env.fork_repo }}:${BRANCH_NAME}" \
              --state open --json number --jq '.[].number' \
              | while read -r pr_num; do
                echo "Closing existing PR #$pr_num"
                gh pr close "$pr_num" --repo ScoopInstaller/Extras --delete-branch
              done
          fi

          # Check if open PR already exists
          EXISTING_PR=$(gh pr list --repo ScoopInstaller/Extras \
            --head "${{ env.fork_repo }}:${BRANCH_NAME}" \
            --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Open PR #$EXISTING_PR already exists — skipping creation"
            exit 0
          fi

          gh pr create \
            --repo ScoopInstaller/Extras \
            --head "${{ env.fork_repo }}:${BRANCH_NAME}" \
            --base master \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            || echo "PR creation failed or already exists"
