name: Update via GitHub API

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to winget-pkgs regardless of version change'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    outputs:
      latest_version: ${{ steps.extract_data.outputs.LATEST_VERSION }}
      exe_sha: ${{ steps.extract_data.outputs.EXE_SHA }}
      update_winget: ${{ steps.check_versions.outputs.UPDATE_WINGET }}
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Step 2: Extract version and SHA256 hashes via GitHub API
      - name: Extract version and hashes
        id: extract_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/abakum/crocson/releases/latest > release.json

          # Extract version (remove 'v' prefix)
          VERSION=$(jq -r '.tag_name | ltrimstr("v")' release.json)
          echo "Latest version: $VERSION"

          # Extract SHA256 hashes from the .digest field (format: 'sha256:...')
          TAR_SHA=$(jq -r '.assets[] | select(.name == "crocson.tar.xz") | .digest // empty' release.json | cut -d: -f2)
          EXE_SHA=$(jq -r '.assets[] | select(.name == "crocson.exe") | .digest // empty' release.json | cut -d: -f2)
          DMG_ARM_SHA=$(jq -r '.assets[] | select(.name == "crocson-arm64.dmg") | .digest // empty' release.json | cut -d: -f2)
          DMG_INTEL_SHA=$(jq -r '.assets[] | select(.name == "crocson-amd64.dmg") | .digest // empty' release.json | cut -d: -f2)

          # Verify all required hashes were found
          if [[ -z "$TAR_SHA" ]] || [[ -z "$EXE_SHA" ]] || [[ -z "$DMG_ARM_SHA" ]] || [[ -z "$DMG_INTEL_SHA" ]]; then
            echo "Error: Some SHA256 hashes not found in release assets"
            echo "Make sure all required files are present in the GitHub release"
            exit 1
          fi

          echo "SHA256 hashes found:"
          echo "  tar.xz (Linux): $TAR_SHA"
          echo "  exe (Windows): $EXE_SHA"
          echo "  dmg-arm64 (macOS Apple Silicon): $DMG_ARM_SHA"
          echo "  dmg-amd64 (macOS Intel): $DMG_INTEL_SHA"

          {
            echo "LATEST_VERSION=$VERSION"
            echo "TAR_SHA=$TAR_SHA"
            echo "EXE_SHA=$EXE_SHA"
            echo "DMG_ARM_SHA=$DMG_ARM_SHA"
            echo "DMG_INTEL_SHA=$DMG_INTEL_SHA"
          } >> "$GITHUB_OUTPUT"

      # Step 3: Check current versions in our package files
      - name: Check current versions in package files
        id: check_versions
        run: |
          # Read current versions from files
          CURRENT_VERSION_CASK=$(grep -oP 'version "\K[^"]+' Casks/crocson.rb 2>/dev/null || echo "")
          CURRENT_VERSION_FORMULA=$(grep -oP 'releases/download/v\K[^/]+' Formula/crocson.rb 2>/dev/null || echo "")
          CURRENT_VERSION_SCOOP=$(jq -r '.version // empty' bucket/crocson.json 2>/dev/null || echo "")
          CURRENT_VERSION_WINGET=$(grep -oP 'PackageVersion: \K[\d.]+' winget/abakum.crocson.yaml 2>/dev/null || echo "")
          
          echo "Current versions in package files:"
          echo "  Homebrew Cask (macOS): $CURRENT_VERSION_CASK"
          echo "  Homebrew Formula (Linux): $CURRENT_VERSION_FORMULA"
          echo "  Scoop Manifest (Windows): $CURRENT_VERSION_SCOOP"
          echo "  Winget Manifest (Windows): $CURRENT_VERSION_WINGET"
          
          LATEST_VERSION="${{ steps.extract_data.outputs.LATEST_VERSION }}"
          
          # Determine which packages need updates
          UPDATE_CASK=false
          UPDATE_FORMULA=false
          UPDATE_SCOOP=false
          UPDATE_WINGET=false
          
          if [[ -n "$CURRENT_VERSION_CASK" ]] && [[ "$CURRENT_VERSION_CASK" != "$LATEST_VERSION" ]]; then
            UPDATE_CASK=true
          fi
          
          if [[ -n "$CURRENT_VERSION_FORMULA" ]] && [[ "$CURRENT_VERSION_FORMULA" != "$LATEST_VERSION" ]]; then
            UPDATE_FORMULA=true
          fi
          
          if [[ -n "$CURRENT_VERSION_SCOOP" ]] && [[ "$CURRENT_VERSION_SCOOP" != "$LATEST_VERSION" ]]; then
            UPDATE_SCOOP=true
          fi
          
          if [[ -n "$CURRENT_VERSION_WINGET" ]] && [[ "$CURRENT_VERSION_WINGET" != "$LATEST_VERSION" ]]; then
            UPDATE_WINGET=true
          fi
          
          echo "Updates needed:"
          echo "  Homebrew Cask: $UPDATE_CASK"
          echo "  Homebrew Formula: $UPDATE_FORMULA"
          echo "  Scoop Manifest: $UPDATE_SCOOP"
          echo "  Winget Manifest: $UPDATE_WINGET"
          
          # Export results for conditional steps (объединенные echo для SC2129)
          {
            echo "UPDATE_CASK=$UPDATE_CASK"
            echo "UPDATE_FORMULA=$UPDATE_FORMULA"
            echo "UPDATE_SCOOP=$UPDATE_SCOOP"
            echo "UPDATE_WINGET=$UPDATE_WINGET"
            echo "CURRENT_VERSION_CASK=$CURRENT_VERSION_CASK"
            echo "CURRENT_VERSION_FORMULA=$CURRENT_VERSION_FORMULA"
            echo "CURRENT_VERSION_SCOOP=$CURRENT_VERSION_SCOOP"
            echo "CURRENT_VERSION_WINGET=$CURRENT_VERSION_WINGET"
          } >> "$GITHUB_OUTPUT"

      # Step 4: Update Homebrew Cask for macOS (if needed)
      - name: Update Homebrew Cask file
        if: steps.check_versions.outputs.UPDATE_CASK == 'true'
        env:
          NEW_VERSION: "${{ steps.extract_data.outputs.LATEST_VERSION }}"
          ARM_SHA: "${{ steps.extract_data.outputs.DMG_ARM_SHA }}"
          INTEL_SHA: "${{ steps.extract_data.outputs.DMG_INTEL_SHA }}"
        run: |
          echo "Updating Homebrew Cask to version $NEW_VERSION..."
          
          ruby <<-'RUBY'
            file = "Casks/crocson.rb"
            content = File.read(file)
            
            # Update version number
            content.gsub!(/version "[\d\.]+"/, "version \"#{ENV['NEW_VERSION']}\"")
            
            # Update SHA256 hashes for both architectures
            # Format: sha256 arm: "...", intel: "..."
            content.gsub!(/sha256\s+arm:\s*"[a-f0-9]+"/, "sha256 arm:          \"#{ENV['ARM_SHA']}\"")
            content.gsub!(/intel:\s*"[a-f0-9]+"/, "intel:        \"#{ENV['INTEL_SHA']}\"")
            
            File.write(file, content)
            puts "✅ Homebrew Cask file updated to v#{ENV['NEW_VERSION']}"
          RUBY

      # Step 5: Update Homebrew Formula for Linux (if needed)
      - name: Update Homebrew Formula file
        if: steps.check_versions.outputs.UPDATE_FORMULA == 'true'
        env:
          NEW_VERSION: "${{ steps.extract_data.outputs.LATEST_VERSION }}"
          TAR_SHA: "${{ steps.extract_data.outputs.TAR_SHA }}"
        run: |
          echo "Updating Homebrew Formula to version $NEW_VERSION..."
          
          ruby <<-'RUBY'
            file = "Formula/crocson.rb"
            content = File.read(file)
            
            # Update download URL with new version
            old_url_pattern = %r{url "https://github\.com/abakum/crocson/releases/download/v[\d\.]+/crocson\.tar\.xz"}
            new_url = "url \"https://github.com/abakum/crocson/releases/download/v#{ENV['NEW_VERSION']}/crocson.tar.xz\""
            content.gsub!(old_url_pattern, new_url)
            
            # Update SHA256 hash
            content.gsub!(/sha256 "[a-f0-9]+"/, "sha256 \"#{ENV['TAR_SHA']}\"")
            
            File.write(file, content)
            puts "Homebrew Formula file updated to v#{ENV['NEW_VERSION']}"
          RUBY

      # Step 6: Update Scoop Manifest for Windows (if needed)
      - name: Update Scoop Manifest file
        if: steps.check_versions.outputs.UPDATE_SCOOP == 'true'
        env:
          NEW_VERSION: "${{ steps.extract_data.outputs.LATEST_VERSION }}"
          EXE_SHA: "${{ steps.extract_data.outputs.EXE_SHA }}"
        run: |
          echo "Updating Scoop Manifest to version $NEW_VERSION..."
          
          ruby <<-'RUBY'
            require 'json'
            
            file = "bucket/crocson.json"
            
            # Read existing manifest or create template if it doesn't exist
            if File.exist?(file)
              data = JSON.parse(File.read(file))
            else
              data = {
                "version" => ENV['NEW_VERSION'],
                "description" => "GUI for croc — secure file transfer tool",
                "homepage" => "https://github.com/abakum/crocson",
                "license" => "ISC",
                "url" => "",
                "hash" => "",
                "bin" => "crocson.exe",
                "shortcuts" => [["crocson.exe", "Crocson"]],
                "checkver" => "github",
                "autoupdate" => {
                  "url" => "https://github.com/abakum/crocson/releases/download/v$version/crocson.exe"
                }
              }
            end
            
            # Update manifest fields
            data["version"] = ENV['NEW_VERSION']
            data["url"] = "https://github.com/abakum/crocson/releases/download/v#{ENV['NEW_VERSION']}/crocson.exe"
            data["hash"] = ENV['EXE_SHA']
            
            # Write back with pretty formatting
            File.write(file, JSON.pretty_generate(data))
            puts "Scoop Manifest updated to v#{ENV['NEW_VERSION']}"
          RUBY

      # Step 7: Update Winget Manifests for Windows (if needed)
      - name: Update Winget Manifests
        if: steps.check_versions.outputs.UPDATE_WINGET == 'true'
        env:
          NEW_VERSION: "${{ steps.extract_data.outputs.LATEST_VERSION }}"
          EXE_SHA: "${{ steps.extract_data.outputs.EXE_SHA }}"
        run: |
          echo "Updating Winget Manifests to version $NEW_VERSION..."
          
          ruby <<-'RUBY'
            new_version = ENV['NEW_VERSION']
            exe_sha = ENV['EXE_SHA']
            
            # Update version manifest
            file = "winget/abakum.crocson.yaml"
            content = File.read(file)
            content.gsub!(/PackageVersion: [\d.]+/, "PackageVersion: #{new_version}")
            File.write(file, content)
            puts "Winget version manifest updated to v#{new_version}"
            
            # Update installer manifest
            file = "winget/abakum.crocson.installer.yaml"
            content = File.read(file)
            content.gsub!(/PackageVersion: [\d.]+/, "PackageVersion: #{new_version}")
            content.gsub!(%r{InstallerUrl: https://github\.com/abakum/crocson/releases/download/v[\d.]+/crocson\.exe},
                          "InstallerUrl: https://github.com/abakum/crocson/releases/download/v#{new_version}/crocson.exe")
            content.gsub!(/InstallerSha256: [a-f0-9]+/, "InstallerSha256: #{exe_sha}")
            File.write(file, content)
            puts "Winget installer manifest updated to v#{new_version}"
            
            # Update locale manifest
            file = "winget/abakum.crocson.locale.en-US.yaml"
            content = File.read(file)
            content.gsub!(/PackageVersion: [\d.]+/, "PackageVersion: #{new_version}")
            content.gsub!(%r{ReleaseNotesUrl: https://github\.com/abakum/crocson/releases/tag/v[\d.]+},
                          "ReleaseNotesUrl: https://github.com/abakum/crocson/releases/tag/v#{new_version}")
            File.write(file, content)
            puts "Winget locale manifest updated to v#{new_version}"
          RUBY

      # Step 8: Commit, tag and push changes DIRECTLY TO MAIN (clean tag, detailed commit)
      - name: Commit, tag and push changes to main
        if: steps.check_versions.outputs.UPDATE_CASK == 'true' || steps.check_versions.outputs.UPDATE_FORMULA == 'true' || steps.check_versions.outputs.UPDATE_SCOOP == 'true' || steps.check_versions.outputs.UPDATE_WINGET == 'true'
        env:
          TAG_NAME: "v${{ steps.extract_data.outputs.LATEST_VERSION }}"
        run: |
          # Configure git identity for the action
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add changed files to staging
          FILES_ADDED=false
          if [[ "${{ steps.check_versions.outputs.UPDATE_CASK }}" == "true" ]]; then
            git add "Casks/crocson.rb"
            FILES_ADDED=true
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_FORMULA }}" == "true" ]]; then
            git add "Formula/crocson.rb"
            FILES_ADDED=true
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_SCOOP }}" == "true" ]]; then
            git add "bucket/crocson.json"
            FILES_ADDED=true
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_WINGET }}" == "true" ]]; then
            git add "winget/"
            FILES_ADDED=true
          fi
          
          # Exit if no files were updated
          if [[ "$FILES_ADDED" == "false" ]]; then
            echo "No files to update"
            exit 0
          fi
          
          # Check if there are actual changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit (files may already be up to date)"
            exit 0
          fi
          
          # Build descriptive commit message with version changes
          COMMIT_PARTS=()
          if [[ "${{ steps.check_versions.outputs.UPDATE_CASK }}" == "true" ]]; then
            COMMIT_PARTS+=("cask: ${{ steps.check_versions.outputs.CURRENT_VERSION_CASK }}")
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_FORMULA }}" == "true" ]]; then
            COMMIT_PARTS+=("formula: ${{ steps.check_versions.outputs.CURRENT_VERSION_FORMULA }}")
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_SCOOP }}" == "true" ]]; then
            COMMIT_PARTS+=("scoop: ${{ steps.check_versions.outputs.CURRENT_VERSION_SCOOP }}")
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_WINGET }}" == "true" ]]; then
            COMMIT_PARTS+=("winget: ${{ steps.check_versions.outputs.CURRENT_VERSION_WINGET }}")
          fi
          
          # Format detailed commit message: "crocson: Update to version 1.11.32 (cask: 1.11.31, formula: 1.11.31)"
          COMMIT_MESSAGE="crocson: Update to version ${{ steps.extract_data.outputs.LATEST_VERSION }}"
          if [[ ${#COMMIT_PARTS[@]} -gt 0 ]]; then
            COMMIT_MESSAGE="$COMMIT_MESSAGE (${COMMIT_PARTS[0]}"
            for i in "${!COMMIT_PARTS[@]}"; do
              if [[ $i -gt 0 ]]; then
                COMMIT_MESSAGE="$COMMIT_MESSAGE, ${COMMIT_PARTS[$i]}"
              fi
            done
            COMMIT_MESSAGE="$COMMIT_MESSAGE)"
          fi
          
          # Clean tag message without package details: "crocson: Update to version 1.11.32"
          TAG_MESSAGE="crocson: Update to version ${{ steps.extract_data.outputs.LATEST_VERSION }}"
          
          echo "Commit message: $COMMIT_MESSAGE"
          echo "Tag message: $TAG_MESSAGE"
          echo "Tag name: $TAG_NAME"
          
          # Create the commit with detailed message
          git commit -m "$COMMIT_MESSAGE"
          COMMIT_HASH=$(git rev-parse HEAD)
          
          # Create annotated tag (skip if already exists for this version)
          if git tag -l "$TAG_NAME" | grep -q .; then
            echo "Tag $TAG_NAME already exists, skipping tag creation"
          else
            git tag -a "$TAG_NAME" -m "$TAG_MESSAGE" "$COMMIT_HASH"
          fi
          
          # Push commit and tag
          echo "Pushing commit and tag to main branch..."
          git push origin main
          git push origin "$TAG_NAME" 2>/dev/null || echo "Tag $TAG_NAME push skipped (may already exist remotely)"
          
          echo "Changes successfully pushed to main branch with tag $TAG_NAME"
          echo "Package files updated for:"
          if [[ "${{ steps.check_versions.outputs.UPDATE_CASK }}" == "true" ]]; then
            echo "   - macOS (Homebrew Cask)"
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_FORMULA }}" == "true" ]]; then
            echo "   - Linux (Homebrew Formula)"
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_SCOOP }}" == "true" ]]; then
            echo "   - Windows (Scoop Manifest)"
          fi
          if [[ "${{ steps.check_versions.outputs.UPDATE_WINGET }}" == "true" ]]; then
            echo "   - Windows (Winget Manifest)"
          fi

  publish:
    needs: update-all
    if: needs.update-all.outputs.update_winget == 'true' || github.event.inputs.force_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fork winget-pkgs and create PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PKG_ID: abakum.crocson
          VERSION: ${{ needs.update-all.outputs.latest_version }}
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone winget-pkgs (shallow)
          git clone --depth=1 https://github.com/microsoft/winget-pkgs.git winget-pkgs

          # Manifest directory structure: manifests/a/abakum/crocson/<version>/
          MANIFEST_DIR="winget-pkgs/manifests/a/abakum/crocson/$VERSION"
          mkdir -p "$MANIFEST_DIR"

          # Copy manifest files
          cp winget/abakum.crocson.yaml "$MANIFEST_DIR/"
          cp winget/abakum.crocson.installer.yaml "$MANIFEST_DIR/"
          cp winget/abakum.crocson.locale.en-US.yaml "$MANIFEST_DIR/"

          # Ensure PackageVersion matches the actual version from release
          sed -i "s/PackageVersion: .*/PackageVersion: $VERSION/" "$MANIFEST_DIR/abakum.crocson.yaml"
          sed -i "s/PackageVersion: .*/PackageVersion: $VERSION/" "$MANIFEST_DIR/abakum.crocson.installer.yaml"
          sed -i "s/PackageVersion: .*/PackageVersion: $VERSION/" "$MANIFEST_DIR/abakum.crocson.locale.en-US.yaml"
          sed -i "s|InstallerUrl: https://github.com/abakum/crocson/releases/download/v.*/crocson.exe|InstallerUrl: https://github.com/abakum/crocson/releases/download/v$VERSION/crocson.exe|" "$MANIFEST_DIR/abakum.crocson.installer.yaml"
          sed -i "s|ReleaseNotesUrl: https://github.com/abakum/crocson/releases/tag/v.*|ReleaseNotesUrl: https://github.com/abakum/crocson/releases/tag/v$VERSION|" "$MANIFEST_DIR/abakum.crocson.locale.en-US.yaml"

          cd winget-pkgs

          # Create a branch
          BRANCH_NAME="abakum.crocson-$VERSION"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "New version: $PKG_ID version $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/$(gh api user --jq .login)/winget-pkgs.git" "$BRANCH_NAME" 2>&1 || {
            # Fork if push fails (repo doesn't exist in fork)
            gh repo fork microsoft/winget-pkgs --clone=false
            git push "https://x-access-token:${GH_TOKEN}@github.com/$(gh api user --jq .login)/winget-pkgs.git" "$BRANCH_NAME"
          }

          # Create PR
          gh pr create \
            --repo microsoft/winget-pkgs \
            --head "$(gh api user --jq .login):$BRANCH_NAME" \
            --base master \
            --title "New version: $PKG_ID version $VERSION" \
            --body "Automated PR to add/update $PKG_ID version $VERSION.

          Manifests are generated from https://github.com/abakum/crocson" || echo "PR may already exist or needs manual creation"
